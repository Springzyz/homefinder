name: poll
on:
  # No schedule: OLX and Casa Sapo block GitHub's datacenter IPs (403/429), so polling runs on a local
  # systemd timer instead. Manual runs stay available for experiments.
  workflow_dispatch:
    inputs:
      pages:
        description: "Result pages per area (use 5 once to backfill market benchmarks)"
        default: "1"
      notify:
        description: "Send alerts (turn off for backfills)"
        type: boolean
        default: true
concurrency: { group: poll, cancel-in-progress: false }
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Poll portals
        env:
          SUPABASE_CONNECTIONSTRING: ${{ secrets.SUPABASE_CONNECTIONSTRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAGES: ${{ inputs.pages }}
          NOTIFY: ${{ inputs.notify }}
        run: |
          ARGS=""
          [[ "$PAGES" =~ ^[1-9]$ ]] && ARGS="--pages=$PAGES"
          [ "$NOTIFY" = "false" ] && ARGS="$ARGS --no-notify"
          pnpm --filter @homefinder/scraper poll $ARGS
